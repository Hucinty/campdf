<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Utility by Hucinty</title>
    <!-- PWA manifest link injected dynamically by JS below -->
    <link id="manifest-link" rel="manifest" href="">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --bg: #ffffff;
            --surface: #f7f7f7;
            --text: #000000;
            --btn-dark: #111111;
            --btn-mid: #333333;
            --btn-light: #555555;
            --btn-accent: #000000;
            --btn-download: #0056b3; /* Distinct color for download button */
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Helvetica Neue', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 3rem 1rem;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 4px;
            margin-bottom: 2rem;
            text-transform: uppercase;
            color: #000000;
            text-align: center;
            border-bottom: 4px solid #000;
            padding-bottom: 0.5rem;
        }

        h1 .brand {
            display: block;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 3px;
            margin-top: 0.5rem;
            color: #555;
        }

        .container {
            width: 100%;
            max-width: 700px;
            position: relative;
            background: var(--surface);
            padding: 1rem;
            border-radius: 0;
            box-shadow: 12px 12px 0px rgba(0, 0, 0, 1);
            margin-bottom: 3rem;
            border: 4px solid #000;
        }

        .video-wrapper {
            width: 100%;
            aspect-ratio: 3 / 4;
            overflow: hidden;
            background: #000;
            position: relative;
            border: 2px solid #000;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: filter 0.3s ease;
        }

        .hud {
            position: absolute;
            top: 1rem;
            left: 1rem;
            background: #000000;
            color: #ffffff;
            padding: 0.5rem 1.2rem;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 2px;
            border: 2px solid #fff;
            z-index: 10;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            width: 100%;
            max-width: 700px;
        }

        button {
            flex: 1;
            min-width: 160px;
            padding: 1.2rem;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            border: 3px solid #000;
            color: #fff;
            transition: all 0.2s ease;
            box-shadow: 4px 4px 0px rgba(0,0,0,1);
        }

        #startBtn { background: var(--btn-dark); }
        #switchBtn { background: var(--btn-mid); display: none; }
        #filterBtn { background: var(--btn-light); display: none; }
        #captureBtn { background: #ffffff; color: #000; display: none; }
        #pdfBtn { background: var(--btn-accent); display: none; }
        #installBtn { background: var(--btn-download); display: none; }

        button:hover:not(:disabled) {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px rgba(0,0,0,1);
        }
        
        #captureBtn:hover:not(:disabled) {
            background: #f0f0f0;
        }

        button:active:not(:disabled) {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px rgba(0,0,0,1);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        canvas { display: none; }
    </style>
</head>
<body>

    <h1>Udaan Scan <span class="brand">BY HUCINTY</span></h1>
    
    <div class="container">
        <div class="video-wrapper">
            <video id="camera" autoplay playsinline></video>
            <div class="hud">PAGES: <span id="pageCount">0</span></div>
        </div>
    </div>
    
    <canvas id="canvas"></canvas>

    <div class="controls">
        <button id="installBtn">Download App</button>
        <button id="startBtn">Open Camera</button>
        <button id="switchBtn">Flip Cam</button>
        <button id="filterBtn">Filter: Normal</button>
        <button id="captureBtn">Capture (A4 Size)</button>
        <button id="pdfBtn">Save PDF</button>
    </div>

    <script>
        // --- Inline PWA Setup ---
        const manifest = {
            "name": "Udaan Scan by Hucinty",
            "short_name": "UdaanScan",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#ffffff",
            "theme_color": "#111111",
            "icons": [
                {
                    "src": "https://dummyimage.com/192x192/000/fff.png&text=Udaan",
                    "sizes": "192x192",
                    "type": "image/png",
                    "purpose": "any maskable"
                },
                {
                    "src": "https://dummyimage.com/512x512/000/fff.png&text=Udaan",
                    "sizes": "512x512",
                    "type": "image/png",
                    "purpose": "any maskable"
                }
            ]
        };

        const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
        document.getElementById('manifest-link').setAttribute('href', URL.createObjectURL(manifestBlob));

        const swCode = `
            self.addEventListener('install', (e) => { self.skipWaiting(); });
            self.addEventListener('activate', (e) => { e.waitUntil(clients.claim()); });
            self.addEventListener('fetch', (e) => { 
                e.respondWith(fetch(e.request).catch(() => new Response("Offline mode active")));
            });
        `;
        const swBlob = new Blob([swCode], { type: 'application/javascript' });
        
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(console.error);
        }

        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');

        // This event only fires if the browser detects a valid PWA setup served over HTTPS
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block'; // Shows the "Download App" button
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    installBtn.style.display = 'none';
                }
                deferredPrompt = null;
            }
        });
        // --- End Inline PWA Setup ---

        // Scanner Logic
        const video = document.getElementById('camera');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        const startBtn = document.getElementById('startBtn');
        const switchBtn = document.getElementById('switchBtn');
        const filterBtn = document.getElementById('filterBtn');
        const captureBtn = document.getElementById('captureBtn');
        const pdfBtn = document.getElementById('pdfBtn');
        const countDisplay = document.getElementById('pageCount');

        let capturedImages = [];
        let currentStream = null;
        let isFrontCamera = false; 
        
        const filters = [
            { name: "Normal", value: "none" },
            { name: "B&W", value: "grayscale(100%)" },
            { name: "Document", value: "grayscale(100%) contrast(150%)" },
            { name: "Sepia", value: "sepia(80%) contrast(110%)" }
        ];
        let currentFilterIndex = 0;

        function drawIvyLeaf(ctx, x, y, size, angle, isDark) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
            
            ctx.fillStyle = isDark ? "#222222" : "#777777";
            ctx.strokeStyle = "#000000";
            ctx.lineWidth = Math.max(1, size * 0.05);

            ctx.beginPath();
            ctx.moveTo(0, 0); 
            ctx.lineTo(-size * 0.3, -size * 0.3);
            ctx.lineTo(-size * 0.8, -size * 0.2); 
            ctx.lineTo(-size * 0.5, -size * 0.6);
            ctx.lineTo(-size * 0.3, -size * 0.7);
            ctx.lineTo(0, -size * 1.1); 
            ctx.lineTo(size * 0.3, -size * 0.7);
            ctx.lineTo(size * 0.5, -size * 0.6);
            ctx.lineTo(size * 0.8, -size * 0.2); 
            ctx.lineTo(size * 0.3, -size * 0.3);
            ctx.closePath();
            
            ctx.fill();
            ctx.stroke();
            ctx.restore();
        }

        function drawIvyBorder(ctx, w, h) {
            const margin = Math.max(30, w * 0.04);
            
            ctx.lineWidth = Math.max(2, w * 0.002);
            ctx.strokeStyle = "#000000";
            ctx.strokeRect(margin, margin, w - margin * 2, h - margin * 2);
            ctx.strokeRect(margin - 6, margin - 6, w - (margin - 6) * 2, h - (margin - 6) * 2);

            ctx.beginPath();
            ctx.moveTo(margin, margin + w * 0.15);
            ctx.bezierCurveTo(margin - w*0.02, margin + w*0.08, margin + w*0.05, margin, margin + w * 0.15, margin);
            
            ctx.moveTo(w - margin - w * 0.15, margin);
            ctx.bezierCurveTo(w - margin, margin, w - margin + w*0.02, margin + w*0.08, w - margin, margin + w * 0.15);
            
            ctx.moveTo(w - margin, h - margin - w * 0.15);
            ctx.bezierCurveTo(w - margin, h - margin, w - margin - w*0.05, h - margin + w*0.02, w - margin - w * 0.15, h - margin);
            
            ctx.moveTo(margin + w * 0.15, h - margin);
            ctx.bezierCurveTo(margin, h - margin, margin - w*0.02, h - margin - w*0.08, margin, h - margin - w * 0.15);
            ctx.stroke();

            const leafSize = Math.max(20, w * 0.035);
            
            const addLeaves = (cx, cy, count, spreadX, spreadY) => {
                for (let i = 0; i < count; i++) {
                    let lx = cx + (Math.random() - 0.5) * spreadX;
                    let ly = cy + (Math.random() - 0.5) * spreadY;
                    let angle = Math.random() * Math.PI * 2;
                    let isDark = Math.random() > 0.4;
                    drawIvyLeaf(ctx, lx, ly, leafSize * (0.6 + Math.random() * 0.6), angle, isDark);
                }
            };

            addLeaves(margin, margin, 14, w*0.18, w*0.18);
            addLeaves(w - margin, margin, 14, w*0.18, w*0.18);
            addLeaves(margin, h - margin, 14, w*0.18, w*0.18);
            addLeaves(w - margin, h - margin, 14, w*0.18, w*0.18);

            for (let x = margin + w*0.25; x < w - margin - w*0.25; x += w*0.15) {
                addLeaves(x, margin, 3, w*0.05, w*0.03); 
                addLeaves(x, h - margin, 3, w*0.05, w*0.03); 
            }
            for (let y = margin + w*0.25; y < h - margin - w*0.25; y += w*0.15) {
                addLeaves(margin, y, 3, w*0.03, w*0.05); 
                addLeaves(w - margin, y, 3, w*0.03, w*0.05); 
            }
        }

        async function setupVideoStream(stream) {
            currentStream = stream;
            video.srcObject = currentStream;
            video.style.transform = isFrontCamera ? 'scaleX(-1)' : 'scaleX(1)';
            
            return new Promise((resolve) => {
                video.onloadedmetadata = async () => {
                    startBtn.style.display = 'none';
                    captureBtn.style.display = 'block';
                    switchBtn.style.display = 'block';
                    filterBtn.style.display = 'block';
                    resolve();
                };
            });
        }

        async function initCamera(constraints, fallback = false) {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }
            try {
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                await setupVideoStream(stream);
            } catch (err) {
                if (err.name === 'NotAllowedError') {
                    alert("Camera blocked! Please allow camera permissions in your browser settings.");
                } else if (!fallback) {
                    try {
                        const fbStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: isFrontCamera ? 'user' : 'environment' } });
                        await setupVideoStream(fbStream);
                    } catch (fbErr) {
                        alert("Failed to open any camera.");
                    }
                }
            }
        }

        startBtn.addEventListener('click', () => {
            initCamera({ 
                video: { 
                    facingMode: 'environment', 
                    width: { ideal: 4096 }, 
                    height: { ideal: 2160 } 
                } 
            });
        });

        switchBtn.addEventListener('click', () => {
            isFrontCamera = !isFrontCamera;
            initCamera({
                video: {
                    facingMode: isFrontCamera ? 'user' : 'environment',
                    width: { ideal: 4096 },
                    height: { ideal: 2160 }
                }
            }, true);
        });

        filterBtn.addEventListener('click', () => {
            currentFilterIndex = (currentFilterIndex + 1) % filters.length;
            const currentFilter = filters[currentFilterIndex];
            filterBtn.innerText = `Filter: ${currentFilter.name}`;
            video.style.filter = currentFilter.value;
        });

        captureBtn.addEventListener('click', () => {
            // A4 Setup
            const w = 1200;
            const h = 1697;
            canvas.width = w;
            canvas.height = h;
            
            // 1. Background
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, w, h);

            // 2. Inner Frame Math
            const imgWidth = w * 0.72; 
            const imgHeight = imgWidth * (4/3); 
            const imgX = (w - imgWidth) / 2; 
            const imgY = (h - imgHeight) / 2; 

            const targetRatio = 3 / 4; 
            let sWidth = video.videoWidth;
            let sHeight = video.videoHeight;
            let sx = 0, sy = 0;

            if (sWidth / sHeight > targetRatio) {
                let newWidth = sHeight * targetRatio;
                sx = (sWidth - newWidth) / 2;
                sWidth = newWidth;
            } else {
                let newHeight = sWidth / targetRatio;
                sy = (sHeight - newHeight) / 2;
                sHeight = newHeight;
            }

            // 3. Draw Camera Image
            ctx.save();
            if (isFrontCamera) {
                ctx.translate(imgX + (imgWidth / 2), 0);
                ctx.scale(-1, 1);
                ctx.translate(-(imgX + (imgWidth / 2)), 0);
            }
            ctx.filter = filters[currentFilterIndex].value;
            ctx.drawImage(video, sx, sy, sWidth, sHeight, imgX, imgY, imgWidth, imgHeight);
            ctx.restore();
            ctx.filter = 'none';

            // 4. Inner Border Lines
            ctx.lineWidth = 4;
            ctx.strokeStyle = "#000000";
            ctx.strokeRect(imgX, imgY, imgWidth, imgHeight);
            ctx.lineWidth = 1;
            ctx.strokeRect(imgX - 12, imgY - 12, imgWidth + 24, imgHeight + 24);
            
            // 5. Outer Ivy Border
            drawIvyBorder(ctx, w, h);

            // 6. BY HUCINTY Tag positioned directly below the image frame, right-aligned
            const tagFontSize = Math.max(16, w * 0.02);
            ctx.font = `800 ${tagFontSize}px 'Helvetica Neue', sans-serif`;
            ctx.letterSpacing = "4px"; 
            ctx.fillStyle = "#000000";
            ctx.textAlign = "right";
            ctx.textBaseline = "top";
            
            // Draw text 25 pixels below the outer inner-frame line
            ctx.fillText("BY HUCINTY", imgX + imgWidth + 12, imgY + imgHeight + 25);

            capturedImages.push(canvas.toDataURL('image/jpeg', 0.95));
            countDisplay.innerText = capturedImages.length;
            pdfBtn.style.display = 'block';
        });

        pdfBtn.addEventListener('click', () => {
            if (capturedImages.length === 0) return;
            
            pdfBtn.innerText = "Processing...";
            pdfBtn.disabled = true;
            captureBtn.disabled = true;

            setTimeout(() => {
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({ 
                    orientation: 'portrait', 
                    unit: 'mm', 
                    format: 'a4' 
                });
                
                const pdfWidth = pdf.internal.pageSize.getWidth();
                const pdfHeight = pdf.internal.pageSize.getHeight();

                capturedImages.forEach((imgData, index) => {
                    if (index > 0) pdf.addPage('a4', 'portrait');
                    pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight, undefined, 'FAST');
                });

                pdf.save('A4_Frames_by_Hucinty.pdf');

                capturedImages = [];
                countDisplay.innerText = "0";
                pdfBtn.style.display = 'none';
                pdfBtn.innerText = "Save PDF";
                pdfBtn.disabled = false;
                captureBtn.disabled = false;
            }, 100);
        });
    </script>
</body>
</html>
